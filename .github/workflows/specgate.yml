name: specgate

# The S6 exit criterion, run as a workflow: a pull request shows findings inline in the
# GitHub UI, sourced from SARIF, with the run's summary in the check output.
#
# The target is `fixtures/ledger`, the application this repository keeps deliberately
# broken. The defect switches default to on, so the run is expected to find things and to
# exit 1. That is the point: a green run here would mean the tool stopped working.

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: specgate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required to upload SARIF. Without it the upload is a 403 and the findings never
  # reach the pull request, whatever the run found.
  security-events: write
  # The upload action reads the workflow run it is part of, so without this it fails
  # with "Resource not accessible by integration" pointing at the workflow runs API,
  # after having already validated the document and added its fingerprints. That reads
  # like a problem with the SARIF and is a problem with this block.
  actions: read

jobs:
  check:
    name: check the fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Start the fixture
        # The switches default to on, so this is the defective configuration. A restart
        # is the reset, and this process is started fresh for this run only.
        run: |
          PORT=3000 node --experimental-strip-types fixtures/ledger/src/index.ts &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health

      - name: Run specgate check
        id: check
        # The action, used as an action, which is the whole point of this step.
        #
        # It used to be four hand written steps that reimplemented what `action.yml`
        # does, borrowing one line of its `dist` to read the report. That exercised the
        # CLI and left the action itself with no execution behind it: the artifact a
        # stranger touches first was the one artifact nothing ran. Calling it here means
        # the input wiring, the CLI resolution, the SARIF upload, the outputs, and the
        # exit code are all covered by the run that already had to happen.
        #
        # `continue-on-error` because the fixture is deliberately defective, so the
        # action is expected to fail the step. The outputs survive it and the assertion
        # at the end of the job is what decides whether the run was correct.
        continue-on-error: true
        uses: ./packages/action
        with:
          spec: fixtures/ledger/spec/ledger.spec.yaml
        env:
          LEDGER_OWNER_TOKEN: ledger-owner-token
          LEDGER_OUTSIDER_TOKEN: ledger-outsider-token
          # Deliberately matches no seeded user. It is fixture data rather than a secret,
          # which is why it is written here and every real credential is not.
          LEDGER_UNKNOWN_TOKEN: ledger-nobody-token

      - name: Write the summary
        # The run's summary in the check output, which is the second half of the exit
        # criterion. Coverage is labeled coverage here as everywhere else.
        run: |
          {
            echo "## SpecGate"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Findings | ${{ steps.check.outputs.findings-total }} |"
            echo "| Error | ${{ steps.check.outputs.findings-error }} |"
            echo "| Warning | ${{ steps.check.outputs.findings-warning }} |"
            echo "| Note | ${{ steps.check.outputs.findings-note }} |"
            echo "| Coverage | ${{ steps.check.outputs.coverage-percent }}% of requirements with at least one check that reached a verdict |"
            echo "| Unverified | ${{ steps.check.outputs.requirements-unverified }} requirement(s) |"
            echo "| Model assisted | ${{ steps.check.outputs.model-assisted-checks }} check(s) |"
            echo ""
            echo "\`specgate check\` exited ${{ steps.check.outputs.exit-code }}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the fixture is still broken, and that the action said so
        # Two assertions in one step, because they fail for different reasons and a
        # reader should be able to tell which happened.
        #
        # The fixture is deliberately defective, so exit 1 is the expected result and a 0
        # would mean the tool stopped finding what is there. That is the opposite polarity
        # to a normal check and is the only honest way to run a tool against an
        # application built to be wrong.
        #
        # The rest asserts the action reported the run rather than merely surviving it.
        # Every output below is produced by `packages/action`, so an empty one means the
        # report reader broke while the CLI stayed fine, which is exactly the failure the
        # old hand written steps could not see.
        run: |
          fail() { echo "::error::$1"; exit 1; }

          code="${{ steps.check.outputs.exit-code }}"
          [ "${code}" = "1" ] || fail "expected exit 1 against the defective fixture, got '${code}'"

          sarif="${{ steps.check.outputs.sarif-file }}"
          [ -n "${sarif}" ] || fail "the action set no sarif-file output"
          [ -f "${sarif}" ] || fail "the action reported ${sarif} and no such file exists"

          total="${{ steps.check.outputs.findings-total }}"
          errors="${{ steps.check.outputs.findings-error }}"
          coverage="${{ steps.check.outputs.coverage-percent }}"

          case "${total}" in ''|*[!0-9]*) fail "findings-total is not a number: '${total}'" ;; esac
          case "${errors}" in ''|*[!0-9]*) fail "findings-error is not a number: '${errors}'" ;; esac
          case "${coverage}" in ''|*[!0-9]*) fail "coverage-percent is not a number: '${coverage}'" ;; esac

          [ "${total}" -gt 0 ] || fail "the action reported 0 findings against the defective fixture"
          [ "${errors}" -gt 0 ] || fail "the action reported no findings at severity high"

          echo "The action exited 1 against the defective fixture, as expected."
          echo "It reported ${total} finding(s), ${errors} at high, and ${coverage}% coverage."
