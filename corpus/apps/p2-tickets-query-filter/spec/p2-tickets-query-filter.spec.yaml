specVersion: '0.1'
name: 'Support tickets'

# Written from prompt P2 in corpus/prompts.md, before reading the application.

actors:
  - id: requester
    description: 'A signed in requester who opened some tickets'
  - id: otherRequester
    description: 'A different signed in requester'
  - id: agent
    description: 'A signed in support agent'
  - id: anonymous
    description: 'A caller presenting no credential'

entities:
  - name: Ticket
    fields:
      - name: id
        type: string
      - name: requester_id
        type: string
      - name: subject
        type: string
      - name: status
        type: string

requirements:
  - id: REQ-001
    statement: 'A requester sees only the tickets they opened'
    entities: [Ticket]
    fields: [Ticket.requester_id]
    tags: [access-control]
    accessRules:
      - id: AR-001-01
        actor: otherRequester
        action: read
        resource: Ticket
        condition: 'Ticket.requester_id != actor.user_id'
        effect: deny
    acceptanceCriteria:
      - id: AC-001-01
        mode: deterministic
        given: 'a ticket opened by somebody else'
        when: 'actor otherRequester reads Ticket TCK-1'
        then: 'status in 403, 404 and body omits field Ticket.subject'

  - id: REQ-002
    statement: 'Listing tickets returns only the tickets the caller opened'
    entities: [Ticket]
    fields: [Ticket.requester_id]
    tags: [access-control]
    accessRules:
      - id: AR-002-01
        actor: otherRequester
        action: list
        resource: Ticket
        condition: 'Ticket.requester_id != actor.user_id'
        effect: deny
    acceptanceCriteria:
      - id: AC-002-01
        mode: deterministic
        given: 'tickets opened by two requesters'
        when: 'actor otherRequester lists Ticket'
        then: 'every row has field requester_id equal to actor.user_id'

  - id: REQ-003
    statement: 'An agent sees every ticket'
    entities: [Ticket]
    tags: [access-control]
    accessRules:
      - id: AR-003-01
        actor: agent
        action: read
        resource: Ticket
        effect: allow
    acceptanceCriteria:
      - id: AC-003-01
        mode: deterministic
        given: 'a ticket opened by a requester'
        when: 'actor agent reads Ticket TCK-1'
        then: 'status is 200 and body has field Ticket.subject'

  - id: REQ-004
    statement: 'A caller who is not signed in sees no ticket'
    entities: [Ticket]
    tags: [access-control]
    accessRules:
      - id: AR-004-01
        actor: anonymous
        action: read
        resource: Ticket
        effect: deny
    acceptanceCriteria:
      - id: AC-004-01
        mode: deterministic
        given: 'an existing ticket'
        when: 'actor anonymous reads Ticket TCK-1'
        then: 'status in 401, 403, 404 and body omits field Ticket.subject'

  - id: REQ-005
    statement: 'Closing a ticket is for agents only'
    entities: [Ticket]
    fields: [Ticket.status]
    tags: [access-control]
    accessRules:
      - id: AR-005-01
        actor: requester
        action: update
        resource: Ticket
        effect: deny
    acceptanceCriteria:
      - id: AC-005-01
        mode: deterministic
        given: 'an open ticket the requester opened'
        when: 'actor requester updates Ticket TCK-1'
        then: 'status in 401, 403 and record Ticket TCK-1 is unchanged'

  - id: REQ-006
    statement: 'A requester can read a ticket they opened'
    entities: [Ticket]
    tags: [access-control]
    accessRules:
      - id: AR-006-01
        actor: requester
        action: read
        resource: Ticket
        effect: allow
