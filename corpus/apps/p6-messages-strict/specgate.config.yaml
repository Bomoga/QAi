target:
  baseUrl: http://127.0.0.1:47810
  disposable: true
  resetCommand: 'node -e "process.stdout.write(\"state is in memory, restart to reset\")"'

actors:
  - id: member
    auth:
      kind: bearer
      tokenEnv: MSGS_MO_TOKEN
    attributes:
      team_id: TEAM-1

  - id: teammate
    auth:
      kind: bearer
      tokenEnv: MSGS_TIA_TOKEN
    attributes:
      team_id: TEAM-1

  - id: outsider
    auth:
      kind: bearer
      tokenEnv: MSGS_ORA_TOKEN
    attributes:
      team_id: TEAM-2

  - id: anonymous
    auth:
      kind: none
    attributes: {}

stateActor: member

resources:
  - name: Channel
    routes:
      read: /api/channels/{id}
      list: /api/channels
    instances:
      - id: CH-1
        attributes:
          team_id: TEAM-1
      - id: CH-2
        attributes:
          team_id: TEAM-2

  - name: Message
    routes:
      read: /api/messages/{id}
      list: /api/messages
      create: /api/messages
    instances:
      - id: MSG-1
        attributes:
          channel_id: CH-1
      - id: MSG-9
        attributes:
          channel_id: DM-1
