# Generated for the corpus. The port is the one corpus/run.ts starts every
# application on, one at a time.

target:
  baseUrl: http://127.0.0.1:47810
  disposable: true
  resetCommand: 'node -e "process.stdout.write(\"state is in memory, restart to reset\")"'

actors:
  - id: owner
    auth:
      kind: bearer
      tokenEnv: INV_OWNER_TOKEN
    attributes:
      org_id: org-1

  - id: outsider
    auth:
      kind: bearer
      tokenEnv: INV_OUTSIDER_TOKEN
    attributes:
      org_id: org-2

  - id: anonymous
    auth:
      kind: none
    attributes: {}

  # Fixture data, deliberately matching no seeded user.
  - id: impostor
    auth:
      kind: bearer
      tokenEnv: INV_UNKNOWN_TOKEN
    attributes: {}

stateActor: owner

resources:
  - name: Invoice
    routes:
      read: /api/invoices/{id}
      list: /api/invoices
      update: /api/invoices/{id}
      delete: /api/invoices/{id}
    instances:
      - id: INV-100
        attributes:
          org_id: org-1
      - id: INV-200
        attributes:
          org_id: org-2
