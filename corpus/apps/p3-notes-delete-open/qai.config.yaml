target:
  baseUrl: http://127.0.0.1:47810
  disposable: true
  resetCommand: 'node -e "process.stdout.write(\"state is in memory, restart to reset\")"'

actors:
  - id: keeper
    auth:
      kind: bearer
      tokenEnv: KEEP_NORA_TOKEN
    attributes:
      user_id: nora

  - id: stranger
    auth:
      kind: bearer
      tokenEnv: KEEP_SAM_TOKEN
    attributes:
      user_id: sam

  - id: anonymous
    auth:
      kind: none
    attributes: {}

stateActor: keeper

resources:
  - name: Note
    routes:
      read: /api/notes/{id}
      list: /api/notes
      update: /api/notes/{id}
      delete: /api/notes/{id}
    instances:
      - id: N-1
        attributes:
          owner_id: nora
          shared: 'false'
      - id: N-9
        attributes:
          owner_id: sam
          shared: 'false'
