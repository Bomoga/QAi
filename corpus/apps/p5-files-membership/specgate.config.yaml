target:
  baseUrl: http://127.0.0.1:47810
  disposable: true
  resetCommand: 'node -e "process.stdout.write(\"state is in memory, restart to reset\")"'

actors:
  - id: member
    auth:
      kind: bearer
      tokenEnv: FILES_MEMBER_TOKEN
    attributes:
      project_id: PROJ-A

  - id: nonMember
    auth:
      kind: bearer
      tokenEnv: FILES_NONMEMBER_TOKEN
    attributes:
      project_id: PROJ-B

  - id: anonymous
    auth:
      kind: none
    attributes: {}

stateActor: member

resources:
  - name: File
    routes:
      read: /api/files/{id}
      list: /api/files
      update: /api/files/{id}
    instances:
      - id: FILE-1
        attributes:
          project_id: PROJ-A
      - id: FILE-3
        attributes:
          project_id: PROJ-B
