# Points at fixtures/ledger, the only target this repository configures.
# Credentials are named here and set in the environment, never written down.

target:
  baseUrl: http://127.0.0.1:3000
  sourceRoot: fixtures/ledger
  disposable: true
  # The ledger holds its data in memory, so a restart is the reset.
  resetCommand: 'node -e "process.stdout.write(\"ledger state is in memory, restart to reset\")"'

actors:
  - id: owner
    auth:
      kind: bearer
      tokenEnv: LEDGER_OWNER_TOKEN
    attributes:
      org_id: org-1

  - id: outsider
    auth:
      kind: bearer
      tokenEnv: LEDGER_OUTSIDER_TOKEN
    attributes:
      org_id: org-2

  - id: anonymous
    auth:
      kind: none
    attributes: {}

# Who persisted state is read as, after an action has been taken. It cannot be the
# acting actor: the criterion that most needs it acts as an unauthenticated caller who
# cannot read the record at all, and reading state as the actor under test would report
# a scoping rule as a state fact.
#
# `owner` is scoped to org-1, which is the right identity for the records the criteria
# here compare and the wrong one in general. An unscoped reader would be better and this
# fixture has none, so a count of an entity owned by another organization would come back
# short rather than wrong. Worth remembering when the corpus run needs one.
stateActor: owner

# Routes and seeded records. An access rule names a resource, not a URL, and the tool
# refuses to guess one from the entity name. Until the probe in M4 can discover these,
# this is where the mapping comes from.
resources:
  - name: Invoice
    routes:
      read: /api/invoices/{id}
      list: /api/invoices
      update: /api/invoices/{id}
      delete: /api/invoices/{id}
    instances:
      - id: INV-1001
        attributes:
          org_id: org-1
      - id: INV-2001
        attributes:
          org_id: org-2

redaction:
  extraPatterns:
    - '(?i)api[_-]?key'
