packages:
  - 'packages/*'
  - 'fixtures/*'

# esbuild ships a platform binary its install script links into place.
# It backs tsup and vitest, both of which are tooling only.
#
# better-sqlite3 is a native module and its install script is what builds or fetches the
# binding. Without it the package cannot load at all. It is named in 04-CONVENTIONS.md as
# an approved runtime dependency and modules/M6-store-delta.md requires it by name for
# `.qai/runs.db`, so the dependency itself is already a decision this only follows through
# on. It is the only runtime dependency here allowed to run a build script.
allowBuilds:
  better-sqlite3: true
  esbuild: true
