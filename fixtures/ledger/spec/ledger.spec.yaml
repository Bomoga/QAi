specVersion: '0.1'
name: 'Ledger invoicing'

# This describes the ledger app as intended, not as built. Every defect in the
# catalog in docs/plan/06-TESTING.md is a disagreement between this file and the
# running application, which is the disagreement the tool exists to find.
#
# Requirements are numbered to match the defect they cover where one exists:
# REQ-001 to REQ-003 cover D1 to D3, REQ-004 covers D4, REQ-005 and REQ-006 cover
# the structural defects D5 and D6, and REQ-007 covers D7. The rest describe
# behavior the app gets right, so a run that flags them has produced a false
# positive, which invariant I2 treats as worse than a missed finding.
#
# Criteria were rewritten at M5.8-pre2 into the two vocabularies in
# modules/M5-behavioral-checks.md, `when` as a request and `then` as assertions.
# The file was authored at M1.8 in prose, before either table existed, so none of
# the `when` clauses and only four of the `then` clauses could be read. Three
# clauses stay in prose on purpose, each with a comment saying why: they are the
# coverage gaps, and a criterion that cannot be checked is meant to be visible as
# a warning rather than quietly rewritten into something narrower.

actors:
  - id: owner
    description: 'Authenticated user belonging to organization org-1'
  - id: outsider
    description: 'Authenticated user belonging to organization org-2'
  - id: anonymous
    description: 'Unauthenticated caller carrying no credentials'

entities:
  - name: Organization
    fields:
      - name: id
        type: string
      - name: name
        type: string

  - name: User
    ownedBy: Organization
    fields:
      - name: id
        type: string
      - name: email
        type: string
      - name: org_id
        type: string
      - name: token
        type: string
        sensitive: true

  - name: Invoice
    ownedBy: Organization
    fields:
      - name: id
        type: string
      - name: org_id
        type: string
      - name: total_cents
        type: number
      - name: notes
        type: string
        sensitive: true

  # D6: specified and never implemented. The structural diff should report this
  # as specifiedNotObserved at low severity.
  - name: AuditLog
    ownedBy: Organization
    fields:
      - name: id
        type: string
      - name: org_id
        type: string
      - name: action
        type: string
      - name: invoice_id
        type: string

requirements:
  # D1, the seeded defect. High severity, and the finding S3 has to produce.
  - id: REQ-001
    statement: 'A user can only read invoices belonging to their own organization'
    entities: [Invoice, Organization]
    fields: [Invoice.org_id]
    tags: [access-control]
    accessRules:
      - id: AR-001-01
        actor: outsider
        action: read
        resource: Invoice
        condition: 'Invoice.org_id != actor.org_id'
        effect: deny
    acceptanceCriteria:
      # "the body contains no Invoice fields" is spelled out field by field, since
      # the vocabulary asserts one named field at a time. Naming all four is what
      # the prose meant; asserting only org_id would pass on a body that returned
      # the rest of the record.
      - id: AC-001-01
        mode: deterministic
        given: 'an invoice belonging to organization org-1'
        when: 'actor outsider reads Invoice INV-1001'
        then: 'status in 403, 404 and body omits field Invoice.id and body omits field Invoice.org_id and body omits field Invoice.total_cents and body omits field Invoice.notes'

  # D2, not yet implemented in the app. The list endpoint does not exist at all
  # today, so this requirement is expected to be unverified until it does.
  - id: REQ-002
    statement: 'Listing invoices returns only invoices belonging to the caller organization'
    entities: [Invoice]
    fields: [Invoice.org_id]
    tags: [access-control]
    accessRules:
      - id: AR-002-01
        actor: outsider
        action: list
        resource: Invoice
        condition: 'Invoice.org_id != actor.org_id'
        effect: deny
    acceptanceCriteria:
      # Coverage gap, deliberately left in prose. The `then` compares a field on
      # every returned row against an attribute of the caller, and the assertion
      # table has no per-row form. Rewriting it into something the table can state
      # would assert less than the requirement says. The access rule above covers
      # the same ground deterministically, so the gap costs a duplicate check
      # rather than the finding itself.
      - id: AC-002-01
        mode: deterministic
        given: 'invoices belonging to both organizations'
        when: 'actor outsider lists Invoice'
        then: 'every returned invoice has org_id equal to the caller organization'

  # D3, mutation reachable without credentials.
  - id: REQ-003
    statement: 'Modifying an invoice requires an authenticated caller'
    entities: [Invoice]
    tags: [access-control, authentication]
    accessRules:
      - id: AR-003-01
        actor: anonymous
        action: update
        resource: Invoice
        effect: deny
      - id: AR-003-02
        actor: anonymous
        action: delete
        resource: Invoice
        effect: deny
    acceptanceCriteria:
      # "and the invoice is unchanged" was dropped rather than left in prose,
      # because it needs the record read before and after the action and the
      # vocabulary offers only a count. Keeping it would make the whole criterion
      # unsupported and leave D3 with no behavioral coverage at all. What remains
      # is narrower than the sentence that was here, which is the cost of the
      # rewrite and is recorded in the M5 Open questions.
      - id: AC-003-01
        mode: deterministic
        given: 'an existing invoice'
        when: 'actor anonymous updates Invoice INV-1001'
        then: 'status is 401'

  # D4, a sensitive field returned where it should be omitted.
  - id: REQ-004
    statement: 'Invoice notes are omitted from list responses'
    entities: [Invoice]
    fields: [Invoice.notes]
    tags: [data-exposure]
    acceptanceCriteria:
      - id: AC-004-01
        mode: deterministic
        given: 'an invoice carrying notes'
        when: 'actor owner lists Invoice'
        then: 'body omits field Invoice.notes'

  # D5, the undeclared debug endpoint. Nothing here declares it, which is exactly
  # what makes the structural diff able to report it as observed and not specified.
  - id: REQ-005
    statement: 'The application exposes no administrative or debug endpoints'
    tags: [surface-area]
    acceptanceCriteria:
      - id: AC-005-01
        mode: deterministic
        given: 'the running application'
        when: 'actor anonymous requests /api/debug/state'
        then: 'status is 404'

      # The one fuzzy criterion in this file, and the subject of the S5 exit
      # criterion. The index page lists the routes the application offers, and
      # whether a route reads as administrative is a judgment rather than an
      # assertion, which is what `mode: fuzzy` is for. It can produce pass or
      # inconclusive and never fail, per invariant I1, so the deterministic
      # criterion above stays the one that reports the defect.
      - id: AC-005-02
        mode: fuzzy
        given: 'the running application'
        when: 'actor anonymous requests /'
        then: 'the page offers no administrative or debug route'

  # D6, the audit entity specified above and never built.
  - id: REQ-006
    statement: 'Every modification to an invoice is recorded in an audit log entry'
    entities: [AuditLog, Invoice]
    tags: [audit]
    acceptanceCriteria:
      # "referencing that invoice" is outside the table, which counts records and
      # does not filter them. The count is the honest remainder: with no AuditLog
      # route to read, the count comes back unevaluable and the criterion is
      # inconclusive, which is the right answer for an entity that was specified
      # and never built.
      - id: AC-006-01
        mode: deterministic
        given: 'an authenticated owner and one of their invoices'
        when: 'actor owner updates Invoice INV-1001'
        then: 'record count of AuditLog is 1'

  # D7, deliberately no checks. Loads with a warning and reports as unverified
  # with reason no-checks-defined, which is how a coverage gap stays visible.
  - id: REQ-007
    statement: 'Invoice totals are displayed in the organization preferred currency'
    entities: [Invoice, Organization]
    tags: [presentation]

  # N1, the negative control. The owner reading their own invoice must keep
  # working. A finding here is a false positive and blocks merge.
  - id: REQ-008
    statement: 'A user can read invoices belonging to their own organization'
    entities: [Invoice]
    fields: [Invoice.org_id]
    tags: [access-control]
    accessRules:
      - id: AR-008-01
        actor: owner
        action: read
        resource: Invoice
        condition: 'Invoice.org_id == actor.org_id'
        effect: allow
    acceptanceCriteria:
      - id: AC-008-01
        mode: deterministic
        given: 'an invoice belonging to the caller organization'
        when: 'actor owner reads Invoice INV-1001'
        then: 'status is 200 and body contains field Invoice.id'

  # N2, the second negative control. A cross-organization write is already
  # refused, so a finding here is also a false positive.
  - id: REQ-009
    statement: 'A user cannot modify invoices belonging to another organization'
    entities: [Invoice]
    fields: [Invoice.org_id]
    tags: [access-control]
    accessRules:
      - id: AR-009-01
        actor: outsider
        action: update
        resource: Invoice
        condition: 'Invoice.org_id != actor.org_id'
        effect: deny
    acceptanceCriteria:
      # The unchanged half was dropped here for the same reason as AC-003-01, and
      # at the same cost. The ledger tests hold N2 in both directions, so the
      # control itself is not resting on this criterion alone.
      - id: AC-009-01
        mode: deterministic
        given: 'an invoice belonging to organization org-1'
        when: 'actor outsider updates Invoice INV-1001'
        then: 'status in 403, 404'

  - id: REQ-010
    statement: 'An unauthenticated caller cannot read any invoice'
    entities: [Invoice]
    tags: [access-control, authentication]
    accessRules:
      - id: AR-010-01
        actor: anonymous
        action: read
        resource: Invoice
        effect: deny
    acceptanceCriteria:
      - id: AC-010-01
        mode: deterministic
        given: 'an existing invoice'
        when: 'actor anonymous reads Invoice INV-1001'
        then: 'status is 401'

  - id: REQ-011
    statement: 'A request carrying an unrecognized token is refused'
    entities: [User]
    tags: [authentication]
    accessRules:
      - id: AR-011-01
        actor: anonymous
        action: read
        resource: User
        effect: deny
    acceptanceCriteria:
      # Coverage gap, and this one is about the target rather than the vocabulary.
      # Every request form names a configured actor, and no actor carries a token
      # belonging to no user; `anonymous` sends no credential at all, which is
      # REQ-010 and a different claim. Configuring a fourth actor with a bogus
      # token would express it.
      - id: AC-011-01
        mode: deterministic
        given: 'a bearer token belonging to no user'
        when: 'the caller requests an invoice by id'
        then: 'status is 401'

  - id: REQ-012
    statement: 'A request for an invoice that does not exist reports it as absent'
    entities: [Invoice]
    tags: [correctness]
    acceptanceCriteria:
      - id: AC-012-01
        mode: deterministic
        given: 'an authenticated owner'
        when: 'actor owner reads Invoice INV-9999'
        then: 'status is 404'

  - id: REQ-013
    statement: 'A refused cross-organization read does not confirm that the invoice exists'
    entities: [Invoice]
    tags: [access-control, data-exposure]
    acceptanceCriteria:
      # The prose compared this status against the one another request returns,
      # which no assertion form can state. REQ-012 pins the absent-invoice status
      # at 404, so naming 404 here says the same thing about this application.
      # It says it less generally: if REQ-012 ever changes, this literal has to
      # change with it, and nothing enforces that.
      - id: AC-013-01
        mode: deterministic
        given: 'an invoice belonging to another organization'
        when: 'actor outsider reads Invoice INV-1001'
        then: 'status is 404'

  - id: REQ-014
    statement: 'A user token is never returned in any response body'
    entities: [User]
    fields: [User.token]
    tags: [data-exposure]
    acceptanceCriteria:
      # "any endpoint by any actor" is a universal, and every request form names
      # one actor and one route. It becomes one criterion per endpoint that
      # returns a record, which is the whole surface a token could leak through
      # today. An endpoint added later is not covered until someone adds a
      # criterion for it, and that is worse than the sentence it replaces.
      - id: AC-014-01
        mode: deterministic
        given: 'the running application'
        when: 'actor owner lists Invoice'
        then: 'body omits field User.token'

      - id: AC-014-02
        mode: deterministic
        given: 'the running application'
        when: 'actor owner reads Invoice INV-1001'
        then: 'body omits field User.token'

  - id: REQ-015
    statement: 'The application reports its health without requiring credentials'
    tags: [operability]
    acceptanceCriteria:
      - id: AC-015-01
        mode: deterministic
        given: 'the running application'
        when: 'actor anonymous requests /health'
        then: 'status is 200 and body.status equals "ok"'
